<!doctype html>
<!-- Static copy of the participation form so Netlify Forms can detect it at build time.
     The real form is rendered by React in src/components/EntryForm.tsx and posts here via fetch.
     Keep the form name and field names in sync with that component. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>athar-tayeb</title>
  </head>
  <body>
    <form name="athar-tayeb" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="athar-tayeb" />
      <input name="bot-field" />
      <input name="name" />
      <input name="anonymous" />
      <input name="participantType" />
      <input name="category" />
      <input name="recipient" />
      <textarea name="message"></textarea>
      <input name="submittedAt" />
    </form>
  </body>
</html>
